<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAEP | Usuários</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body class="form-page">
    <main class="form-shell">
      <nav class="topbar"><a class="back-link" href="index.html">← Central</a><span>SAEP / Usuários</span></nav>
      <header class="form-intro">
        <p class="eyebrow">Módulo 03 / Cadastro</p>
        <h1>Usuários</h1>
        <p>Cadastre os responsáveis pelo sistema e mantenha o controle de acesso organizado.</p>
      </header>
      <section class="record-layout">
        <form class="record-form" action="/usuarios" method="post">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" autocomplete="name" required>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="new-password" required>
          <button class="submit-button" type="submit">Salvar usuário</button>
        </form>
        <aside class="consult-box">
          <h2>Equipe cadastrada</h2>
          <p>Acesse a rota de consulta para visualizar os usuários registrados.</p>
          <a class="consult-link" href="/usuarios">Consultar registros →</a>
        </aside>
      </section>
    </main>
  </body>
</html>
