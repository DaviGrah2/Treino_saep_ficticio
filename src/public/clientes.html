<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAEP | Clientes</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body class="form-page">
    <main class="form-shell">
      <nav class="topbar"><a class="back-link" href="index.html">← Central</a><span>SAEP / Clientes</span></nav>
      <header class="form-intro">
        <p class="eyebrow">Módulo 01 / Cadastro</p>
        <h1>Clientes</h1>
        <p>Registre os dados de contato dos proprietários e mantenha sua base sempre atualizada.</p>
      </header>
      <section class="record-layout">
        <form class="record-form" action="/clientes" method="post">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" autocomplete="name" required>
          <label for="telefone">Telefone</label>
          <input id="telefone" name="telefone" type="tel" autocomplete="tel" required>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <button class="submit-button" type="submit">Salvar cliente</button>
        </form>
        <aside class="consult-box">
          <h2>Base de clientes</h2>
          <p>Acesse a rota de consulta para visualizar os registros cadastrados.</p>
          <a class="consult-link" href="/clientes">Consultar registros →</a>
        </aside>
      </section>
    </main>
  </body>
</html>
